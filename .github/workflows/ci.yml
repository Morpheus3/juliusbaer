name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

jobs:
  typescript:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: rmw
          POSTGRES_PASSWORD: rmw_local_dev
          POSTGRES_DB: rm_workbench
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U rmw -d rm_workbench"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://rmw:rmw_local_dev@localhost:5433/rm_workbench
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run build -w @jb/web

  analytics:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/analytics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy app
      - run: pytest -q

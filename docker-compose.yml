name: rm-workbench

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: rmw-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rmw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rmw_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-rm_workbench}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-rmw} -d ${POSTGRES_DB:-rm_workbench}']
      interval: 5s
      timeout: 3s
      retries: 20

  analytics:
    build: ./services/analytics
    container_name: rmw-analytics
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-rmw}:${POSTGRES_PASSWORD:-rmw_local_dev}@postgres:5432/${POSTGRES_DB:-rm_workbench}
      DATASET_TODAY: ${DATASET_TODAY:-2026-08-26}
    ports:
      - '127.0.0.1:8000:8000'
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ['analytics']

  redpanda:
    image: redpandadata/redpanda:v24.3.5
    container_name: rmw-redpanda
    command:
      - redpanda start
      - --overprovisioned
      - --smp 1
      - --memory 512M
      - --reserve-memory 0M
      - --node-id 0
      - --check=false
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://127.0.0.1:9092
    ports:
      - '127.0.0.1:9092:9092'
    healthcheck:
      test: ['CMD-SHELL', 'rpk cluster health | grep -q "Healthy:.*true"']
      interval: 5s
      timeout: 5s
      retries: 20
    profiles: ['kafka']

volumes:
  pgdata:

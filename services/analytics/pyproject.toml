[project]
name = "rmw-analytics"
version = "0.1.0"
description = "Numeric engines for the RM workbench: customer vectors, impact models, validator"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "psycopg[binary]>=3.2",
  "pandas>=2.2",
  "numpy>=2.0",
  "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ANN", "S", "RUF"]
ignore = ["ANN401", "S101"]

[tool.ruff.lint.per-file-ignores]
# Feature descriptions are prose shown to the RM; keep each on one line.
"app/features/manifest.py" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

# pandas, numpy-on-pandas and sklearn are treated as untyped: their stubs make every row
# access a 12-way union and add nothing to the correctness of our own code.
[[tool.mypy.overrides]]
module = ["pandas.*", "sklearn.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.data.frames", "app.features.*"]
warn_return_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
